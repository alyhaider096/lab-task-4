<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>University Student Management System</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


    
    <div class="container py-5">

        <h1 class="text-center mb-2">
            University Student Management System
        </h1>

        <p class="text-center text-muted mb-5">
            Lab 04 - Task 1
        </p>


        <!--
            JavaScript will put all student cards
            inside this div.

            Right now it is empty.
        -->
        <div
            id="studentContainer"
            class="row g-4">
        </div>

    </div>



    <!-- =====================================================
     TASK 2 - ONLINE COURSE REGISTRATION SYSTEM
===================================================== -->

<section id="task2" class="py-5 bg-light">

    <div class="container">

        <h2 class="text-center mb-4">
            Online Course Registration System
        </h2>

        <p class="text-center text-muted mb-5">
            Lab 04 - Task 2
        </p>


        <!-- JavaScript will display Task 2 result here -->
        <div
            id="courseOutput"
            class="card shadow-sm" >

            <div class="card-body">

                <!-- JS content will come here -->

            </div>

        </div>

    </div>

</section>





<!-- =====================================================
     TASK 3 - STUDENT EXAMINATION RESULT SYSTEM
===================================================== -->

<section id="task3" class="py-5">

    <div class="container">

        <h2 class="text-center mb-2">
            Student Examination and Result Processing System
        </h2>

        <p class="text-center text-muted mb-5">
            Lab 04 - Task 3
        </p>


        <!--
            JavaScript will generate
            all student result cards here
        -->
        <div
            id="resultContainer"
            class="row g-4">
        </div>


        <!--
            Final statistics will be displayed here
        -->
        <div
            id="resultStatistics"
            class="card mt-5 shadow-sm">
        </div>

    </div>

</section>

<!-- TASK 4 - UNIVERSITY STUDENT PERFORMANCE DASHBOARD -->

<section id="task4" class="py-5 bg-light">

    <div class="container">

        <h2 class="text-center mb-2">
            University Student Performance Dashboard
        </h2>

        <p class="text-center text-muted mb-5">
            Lab 04 - Task 4
        </p>
    

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h4>
                    Department Information
                </h4>

                <div id="departmentOutput"></div>

            </div>

        </div>


        <div class="card shadow-sm mb-5">

            <div class="card-body">

                <h4>
                    First Student Object Properties
                </h4>

                <div id="studentPropertiesOutput"></div>

            </div>

        </div>



        <div
            id="performanceDashboard"
            class="row g-4">
        </div>



        <div
            id="dashboardStatistics"
            class="card shadow-sm mt-5">
        </div>

    </div>

</section>





    <!-- Our JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
